name: Build & Release

# ── Triggers ──────────────────────────────────────────────────────────────────
# Automatic: push a tag like v1.2.3
# Manual:    Actions → Run workflow → enter version
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create a GitHub Release

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. .NET 10 ───────────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 3. Determine version ─────────────────────────────────────────────────
      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Version: $v"

      # ── 4. Publish (self-contained single-file exe) ───────────────────────────
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish FileTinder.csproj `
            /p:PublishProfile=win-x64-singlefile `
            /p:Version=${{ steps.ver.outputs.version }} `
            --nologo -v q

      # ── 5. Install Inno Setup 6 ───────────────────────────────────────────────
      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      # ── 6. Compile installer ──────────────────────────────────────────────────
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.ver.outputs.version }} `
            installer.iss

      # ── 7. Generate changelog from commits since last tag ────────────────────
      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prevTag) {
            $all = git log --pretty=format:"%s" | Select-Object -First 30
          } else {
            $all = git log "$prevTag..HEAD" --pretty=format:"%s"
          }
          $all = $all | Where-Object { $_ -notmatch "^Release v" -and $_ -notmatch "^Merge " }

          $feat = $all | Where-Object { $_ -match "\b(add|new|feat|introduc|support|implement|creat|enabl|allow)\b" }
          $fix  = $all | Where-Object { $_ -match "\b(fix|bug|crash|error|broken|revert|patch|correct|resolv)\b" }
          $impr = $all | Where-Object { $_ -notin $feat -and $_ -notin $fix }

          $md = @()
          if ($feat) { $md += "### ✨ What's New"; $feat | ForEach-Object { $md += "- $_" }; $md += "" }
          if ($fix)  { $md += "### 🐛 Bug Fixes";  $fix  | ForEach-Object { $md += "- $_" }; $md += "" }
          if ($impr) { $md += "### 🔧 Improvements"; $impr | ForEach-Object { $md += "- $_" }; $md += "" }
          if (-not $md) { $md = @("No notable changes.") }

          $md += "---"
          $md += "### Install"
          $md += "Download and run the installer below. The app will notify you of future updates automatically."
          $md += ""
          $md += "### Upgrade"
          $md += "Already have Winnow? Click **Download & Install** inside the app, or run the installer — it upgrades in-place."

          ($md -join "`n") | Out-File -FilePath changelog.md -Encoding utf8

      # ── 8. Create GitHub Release & upload installer ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Winnow v${{ steps.ver.outputs.version }}"
          body_path: changelog.md
          append_body: true
          generate_release_notes: true
          files: installer/WinnowSetup-${{ steps.ver.outputs.version }}.exe
          draft: false
          prerelease: false
